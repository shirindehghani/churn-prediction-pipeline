version: "3.9"

services:
  api:
    build: .
    container_name: churn_api
    env_file:
      - .env
    environment:
      SEQ_LEN: "6"
      ARTIFACT_DIR: /app/artifacts
      FEATURE_TABLE: final_features
    ports:
      - "8080:8080"
    volumes:
      - ./notebooks/artifacts:/app/artifacts:ro
