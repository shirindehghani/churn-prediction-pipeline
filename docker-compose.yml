version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/load.sql:/docker-entrypoint-initdb.d/02_load.sql:ro
      - ./data/:/docker-entrypoint-initdb.d/data/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
