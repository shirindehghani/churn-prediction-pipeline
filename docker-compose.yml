version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-sn_dehghani}
      POSTGRES_PASSWORD: ${DB_PASS:-sndi}
      POSTGRES_DB: ${DB_NAME:-sn_dehghani}
    ports:
      - "8000:8000"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # seed script if you have one:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build: .
    depends_on:
      - db
    environment:
      DB_USER: ${DB_USER:-sn_dehghani}
      DB_PASS: ${DB_PASS:-sndi}
      DB_HOST: db
      DB_PORT: "8000"
      DB_NAME: ${DB_NAME:-sn_dehghani}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      FEATURE_TABLE: ${FEATURE_TABLE:-final_features}
      ARTIFACT_DIR: /app/artifacts
    ports:
      - "8001:8001"
    volumes:
      - ./artifacts:/app/artifacts:ro

volumes:
  pgdata:
