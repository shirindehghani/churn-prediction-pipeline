services:
  db:
    image: postgres:15
    container_name: churn_pg
    environment:
      POSTGRES_DB: sn_dehghani
      POSTGRES_USER: sn_dehghani
      POSTGRES_PASSWORD: sndi
    ports:
      - "8000:5432"          # exposes PG on host:8000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sn_dehghani -d sn_dehghani"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .             # directory that contains Dockerfile and the app/ folder
      dockerfile: Dockerfile
    container_name: churn_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: sn_dehghani
      DB_PASS: sndi
      DB_HOST: db
      DB_PORT: "5432"        # inside compose, DB is on default 5432
      DB_NAME: sn_dehghani
      DB_SCHEMA: public
      FEATURE_TABLE: final_features
      TARGET_COL: label
      ARTIFACT_DIR: /artifacts
      SEQ_LEN: "6"
    ports:
      - "8001:8001"
    volumes:
      # mount artifacts from your repo (adjust left path if different)
      - ./notebooks/artifacts:/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
